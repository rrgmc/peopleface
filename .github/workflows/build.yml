# Runs when a version tag (v1.24, ...) is pushed, or a release is created with a new tag
# on GitHub, and manually from the Actions tab.
# A tag build attaches the APK to that tag's release, creating the release if needed.
# A manual build publishes the APK as the "latest" release (replaced on every run).
# Either way the APK can be downloaded from the Releases page, also on a phone.
name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The JDK that gradle/gradle-daemon-jvm.properties asks for, so Gradle does not download one.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build and test
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease testDebugUnitTest \
            "-Ppeopleface.signing.storeFile=$RUNNER_TEMP/release.jks" \
            "-Ppeopleface.signing.storePassword=$SIGNING_STORE_PASSWORD" \
            "-Ppeopleface.signing.keyAlias=$SIGNING_KEY_ALIAS" \
            "-Ppeopleface.signing.keyPassword=$SIGNING_KEY_PASSWORD"
      # Fails on an unsigned APK and prints the certificate fingerprint.
      - name: Verify the APK signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/peopleface-*-release.apk
      - name: Attach APK to the tag's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/peopleface-*-release.apk)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest
          fi
      - name: Publish "latest" release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/peopleface-*-release.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Release APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest

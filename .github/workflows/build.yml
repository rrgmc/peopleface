# Manual-only to keep CI minutes low: run it from the Actions tab when you want an APK.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: peopleface-debug-apk
          path: app/build/outputs/apk/debug/peopleface-*-debug.apk
          retention-days: 7
